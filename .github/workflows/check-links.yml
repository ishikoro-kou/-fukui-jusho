name: 外部リンクの定期チェック

# 毎週月曜 朝9時(日本時間)に自動実行。手動で今すぐ実行することもできます。
on:
  schedule:
    - cron: '0 0 * * 1'   # UTC 0:00 = JST 9:00
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: リンクをチェック
        id: check
        run: |
          set +e
          RESULTS_FILE="broken_links.txt"
          > "$RESULTS_FILE"

          while IFS=$'\t' read -r url desc extra_codes; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac

            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 \
                     -A "Mozilla/5.0 (compatible; FukuiJushoLinkCheck/1.0; +https://github.com/)" \
                     "$url")

            ok="no"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null; then
              ok="yes"
            fi
            if [ -n "$extra_codes" ]; then
              IFS=',' read -ra CODES <<< "$extra_codes"
              for c in "${CODES[@]}"; do
                if [ "$code" = "$c" ]; then ok="yes"; fi
              done
            fi

            if [ "$ok" = "no" ]; then
              echo "- [$desc]($url) → HTTPステータス: $code" >> "$RESULTS_FILE"
            fi
          done < link-check/urls.txt

          if [ -s "$RESULTS_FILE" ]; then
            echo "has_broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_broken=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 既存のIssueを確認
        id: existing
        if: steps.check.outputs.has_broken == 'true'
        run: |
          number=$(gh issue list --search "壊れているリンクがあります in:title" --state open --json number --jq '.[0].number')
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Issueを作成または更新
        if: steps.check.outputs.has_broken == 'true'
        run: |
          BODY_FILE="issue_body.txt"
          {
            echo "自動チェックで、以下のリンクが正常に応答しませんでした。"
            echo "サイトの仕様変更・移転・一時的な不調の可能性があります。手動で開いて確認してください。"
            echo ""
            cat broken_links.txt
            echo ""
            echo "_(このIssueは check-links ワークフローによって自動作成されました。$(date -u '+%Y-%m-%d %H:%M UTC') 実行分)_"
          } > "$BODY_FILE"

          if [ -n "${{ steps.existing.outputs.number }}" ] && [ "${{ steps.existing.outputs.number }}" != "null" ]; then
            gh issue comment "${{ steps.existing.outputs.number }}" --body-file "$BODY_FILE"
          else
            gh issue create --title "⚠️ 壊れているリンクがあります" --body-file "$BODY_FILE" --label "link-check" || \
            gh issue create --title "⚠️ 壊れているリンクがあります" --body-file "$BODY_FILE"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 問題なければ既存Issueを自動クローズ
        if: steps.check.outputs.has_broken == 'false'
        run: |
          number=$(gh issue list --search "壊れているリンクがあります in:title" --state open --json number --jq '.[0].number')
          if [ -n "$number" ] && [ "$number" != "null" ]; then
            gh issue comment "$number" --body "再チェックの結果、すべてのリンクが正常に戻りました。このIssueを閉じます。"
            gh issue close "$number"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
